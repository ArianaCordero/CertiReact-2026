name: Hola Mundo

on:
  push:
  workflow_dispatch:

jobs:
  hola:
    runs-on: ubuntu-latest

    steps:
      - name: Saludar
        run: echo "Hola Mundo"

      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: En que carpeta estoy
        run: pwd

      - name: Listar Archivos
        run: ls -la

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: verificar version de node
        run: node --version

      - name: verificar npm
        run: npm --version

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar JavaScript
        run: npm run check:js